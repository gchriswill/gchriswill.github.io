		<style type=text/css>
			
			body, div {
				
				margin: 0px;
				padding: 0px;
				font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
				-webkit-font-smoothing: antialiased;
				-webkit-backface-visibility: hidden;
				
			}
			
			body {
				
				width: 100%;
				height: 100%;
				background-color: black;
				position: absolute;
	  			display: table;
	  			
			}
			
			div#root-container {
				margin: 0px;
				padding: 0px;
				width: 100%;
				height: 100%;
				display: table-cell;
	  			vertical-align: middle;
				
			}
			
			div#image-container {
				
				background-color: transparent;
				text-align: center;
				
			}
			
			#userImage {
				
				margin: auto;
				padding: 0px;
				width: 128px;
				height: 128px;
				border: 2px solid black;
				border-radius: 66px;
				display: block;
				-webkit-animation: pulseImage 2.2s infinite ease-in-out;
			
			}
			
			h3 {
				
				color: rgba(0,0,0,0.9);
				text-shadow: 0px 0px 25px red;
				-webkit-animation: pulseText 2.2s infinite ease-in-out;
				
			}
			
			a#username {
				
				color: black;
				text-decoration: none;
				background-color: transparent;
				
			}
			
			@-webkit-keyframes pulseImage {
				
				0% {
					box-shadow: 0 0 5px rgba(255, 0, 0, 0.1);
				}
			
				50% {
					box-shadow: 0 0 128px rgba(255, 0, 0, 1);
				}
			
				100% {
					box-shadow: 0 0 5px rgba(255, 0, 0, 0.1);
				}
				
			}
			
			@-webkit-keyframes pulseText {
				
				0% {
					text-shadow: 0 0 0px rgba(255, 0, 0, 0.1);
				}
			
				50% {
					text-shadow: 0 0 25px rgba(255, 0, 0, 1);
				}
			
				100% {
					text-shadow: 0 0 0px rgba(255, 0, 0, 0.1);
				}
				
			}
			
		</style>

		<div id="root-container">
			
			<div id="image-container">
