<!-- @gchriswill:-> Alert message box for development warning -->

<!-- Modal box with a custom warning alert style. Default source found at: http://getbootstrap.com/javascript/#modals  -->
<div class="modal fade dev_modal" tabindex="-1" id="devModal" role="dialog" aria-labelledby="small_modal_close_button" aria-hidden="true">
  
  <!-- Level 2 -->
  <div class="modal-dialog modal-sm">
    
    <!-- Level 3-->
    <div class="modal-content">
    	
    	<!-- Level 4 -->
    	<div class="modal-header">
			<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
			<h4 class="modal-title" id="small_modal_header" >Developer Message:</h4>
		</div>
		
		<div class="modal-body">
			<p>This web-app is currently under development! Updates with patches like bug fixes and improvements are being pushed to Github on a daily basis. Final version will be released soon...<br><br>Sorry for the inconvenience,<br><br>$ ~/ <a href="https://twitter.com/gchriswill">@gchriswill</a></p>
		</div>
		
		<div class="modal-footer">
			<button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
		</div>
		<!-- End of Level 4 -->
    
    </div>
    <!-- End of Level 3 -->
    
  </div>
  <!-- End of Level 2 -->
  
</div>
<!-- End of warning-->
