<!-- @gchriswill:-> Alert message box for development warning -->

<!-- Modal box with a custom warning alert style. Default source found at: http://getbootstrap.com/javascript/#modals  -->

  <!-- Level 2 -->
  <div class="modal-dialog modal-sm">
    
    <!-- Level 3-->
    <div class="modal-content">

    	<div class="modal-header">
			<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>

			<p>This website is currently under development! Updates with patches, bug fixes and improvements are being pushed to Github on a daily basis. Final version will be released soon...<br><br>Sorry for the inconvenience,<br><br>Me: Alert-message <a href="https://twitter.com/gchriswill">gchriswill</a><span class="red_punctuation">$</span> cd <span class="red_punctuation">~/</span></p>
		</div>
		
		<div class="modal-footer">
			<button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
		</div>
		<!-- End of Level 4 -->
    
    </div>
    <!-- End of Level 3 -->
    
  </div>
  <!-- End of Level 2 -->
  
</div>
<!-- End of warning-->
